<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management System</title>

    <link rel="stylesheet" href="../styles/test/style1.css">
</head>

<body>

<header>
    <h1>Product Management System</h1>
</header>

<main>

    <section class="toolbar">

        <button id="toggleFormButton">
            + Add Product
        </button>

        <button id="toggleSearchButton">
            🔍 Search
        </button>

    </section>


    <section
        id="formSection"
        class="form-section"
        hidden
    >

        <h2 id="formTitle">
            Add Product
        </h2>

        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    required
                >

            </div>


            <div class="form-group">

                <label for="price">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                    <option value="out-of-stock">
                        Out of Stock
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                ></textarea>

            </div>


            <button
                type="submit"
                id="submitButton"
            >
                Add Product
            </button>

            <button
                type="button"
                id="cancelButton"
                class="cancel-button"
            >
                Cancel
            </button>

        </form>

    </section>



    <section class="dashboard">

        <div class="card">

            <h3>Total Products</h3>

            <p id="totalProducts">
                0
            </p>

        </div>


        <div class="card">

            <h3>Total Quantity</h3>

            <p id="totalQuantity">
                0
            </p>

        </div>


        <div class="card">

            <h3>Inventory Value</h3>

            <p id="inventoryValue">
                0.00
            </p>

        </div>

    </section>


    <section class="products-section">

        <div class="product-header">

            <h2>
                Products
            </h2>

            <div
                id="searchContainer"
                hidden
            >

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products..."
                >

            </div>

        </div>


        
        <div class="filters">

            <div>

                <label for="categoryFilter">
                    Category
                </label>

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                </select>

            </div>


            <div>

                <label for="statusFilter">
                    Status
                </label>

                <select id="statusFilter">

                    <option value="all">
                        All Status
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                    <option value="out-of-stock">
                        Out of Stock
                    </option>

                </select>

            </div>


            <div>

                <label for="priceSort">
                    Sort by Price
                </label>

                <select id="priceSort">

                    <option value="default">
                        Default
                    </option>

                    <option value="low-high">
                        Low → High
                    </option>

                    <option value="high-low">
                        High → Low
                    </option>

                </select>

            </div>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Name</th>

                        <th>Category</th>

                        <th>Price</th>

                        <th>Quantity</th>

                        <th>Status</th>

                        <th>Description</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="productTableBody">
                </tbody>

            </table>

        </div>

    </section>

</main>


<script type="module" src="../js/test/app1.js"></script>

</body>

</html>
