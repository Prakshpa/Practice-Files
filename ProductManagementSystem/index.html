<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management System</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <button type="button" id="addProduct">Create Product</button>
    <form action="" class="product-form">
        <table>
            <tr>
                <td><label for="pName">Product Name</label></td>
                <td>
                    <input type="text" name="pName" id="pName" placeholder="Product Name">
                    <span class="error"></span>
                </td>
            </tr>
            <tr>
                <td><label for="pDescription">Product Description</label></td>
                <td>
                    <textarea name="pDescription" id="pDescription" placeholder="Product Description"></textarea>
                    <span class="error"></span>
                </td>
            </tr>
            <tr>
                <td><label for="pPrice">Product Price</label></td>
                <td>
                    <input type="number" name="pPrice" id="pPrice" placeholder="Product Price">
                    <span class="error"></span>
                </td>
            </tr>
            <tr>
                <td><label for="pCategory">Product Catagory</label></td>
                <td>
                    <select name="pCategory" id="pCategory" title="Product Category">
                        <option value="">Product Category</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Cosmetics">Cosmetics</option>
                        <option value="Medicine">Medicine</option>
                        <option value="Gadgets">Gadgets</option>
                    </select>
                    <span class="error"></span>
                </td>
            </tr>
            <tr>
                <td><label for="pStock">Product Stock</label></td>
                <td>
                    <input type="number" name="pStock" id="pStock" placeholder="Product Stock">
                    <span class="error"></span>
                </td>
            </tr>
            <tr>
                <td><label for="pStatus">Product Status</label></td>
                <td>
                    <select name="pStatus" id="pStatus">
                        <option value="">Status</option>
                        <option value="Ordered">Ordered</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Stock">Stock</option>
                    </select>
                    <span class="error"></span>
                </td>
            </tr>
        </table>
        <p>
            <button type="submit" id="submit">Create</button>
            <button type="reset" id="cancel">Cancel</button>
        </p>
    </form>
    <form class="search-box">
        <div id="search-options">
            <div id="search-sort">
                <label for="sort">Sort By Price</label>
                <select name="sort" id="sort">
                    <option value="">Sort In</option>
                    <option value="asc">Ascending order</option>
                    <option value="desc">Descending order</option>
                </select>
            </div>
    
            <div id="search-filter">
                <label for="filter">Filter</label>
                <p id="filter">
                    <select name="status" id="status" title="Product status">
                        <option value="">Product Status</option>
                        <option value="Ordered">Ordered</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Stock">Stock</option>
                    </select>
                    <select name="category" id="category" title="Product Category">
                        <option value="">Product Category</option>
                        <option value="Grocery">Grocery</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Cosmetics">Cosmetics</option>
                        <option value="Medicine">Medicine</option>
                        <option value="Gadgets">Gadgets</option>
                    </select>
                </p>
            </div>
        </div>

        <input type="search" placeholder="Search Product" title="search">
        <input type="submit" value="Search">
    </form>
    <section class="content">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </section>
    <section id="summary">
        <h2>Products Summary</h2>
        <div id="product-count"></div>
        <div id="product-value"></div>
    </section>
    <script type="module" src="js/index.js"></script>
</body>
</html>
